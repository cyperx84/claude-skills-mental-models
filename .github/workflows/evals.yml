name: evals

# Manual only. Not part of PR CI because it requires an API key and costs
# real money per run. Trigger from the Actions tab when you want a snapshot.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "grading mode"
        required: false
        default: "judge"
        type: choice
        options:
          - judge
          - substring

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install anthropic

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p evals/baselines
          python evals/run_evals.py \
            --mode ${{ inputs.mode }} \
            --out evals/baselines/ci-${{ github.run_id }}.jsonl

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/baselines/ci-${{ github.run_id }}.jsonl
