name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run model validator
        run: python scripts/validate_models.py
      - name: Regenerate latticework graph
        run: python scripts/build_latticework.py
      - name: Check latticework is up to date
        run: git diff --exit-code docs/latticework.json docs/latticework.mmd docs/latticework_core.mmd
      - name: Check package data in sync
        run: python scripts/sync_package_data.py --check
      - name: Run selector evals (deterministic, no API)
        run: python evals/run_selector_evals.py

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - name: Sync + test package
        working-directory: packages/mental_models
        run: |
          uv sync
          uv run pytest
      - name: Build package
        working-directory: packages/mental_models
        run: uv build

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16
        with:
          globs: "**/*.md"
