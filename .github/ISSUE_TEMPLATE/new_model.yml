name: Propose a New Mental Model
description: Suggest a new mental model to add to the skill
title: "[model] <model name>"
labels: ["new-model"]
body:
  - type: input
    id: name
    attributes:
      label: Model name
      description: The canonical name of the mental model
      placeholder: e.g. Second-Order Thinking
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated areas and situations. These become OKF `tags` — use the words someone would actually type when they have this problem.
      placeholder: e.g. systems-thinking, performance, operations
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: At least one real, resolvable reference — a paper, book, or primary source a reader can go and check. Models without sources are not accepted.
      placeholder: |
        - https://doi.org/... — Author, "Title" (Journal, Year)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: One or two paragraphs explaining the model
    validations:
      required: true
  - type: textarea
    id: keywords
    attributes:
      label: Keywords / situations
      description: Comma-separated keywords or typical situations where this model applies
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why should this model be included? What gap does it fill? Any sources?
    validations:
      required: true
