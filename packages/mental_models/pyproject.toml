[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mental-models"
version = "0.1.0"
description = "Charlie Munger's latticework of mental models as a Python library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cyperx" }]
keywords = ["mental-models", "decision-making", "munger", "thinking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/cyperx84/claude-skills-mental-models"
Repository = "https://github.com/cyperx84/claude-skills-mental-models"

[project.scripts]
mental-models = "mental_models.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mental_models"]

[tool.hatch.build.targets.wheel.force-include]
"src/mental_models/data/model-index.json" = "mental_models/data/model-index.json"

[tool.hatch.build.targets.sdist]
include = ["src/mental_models", "README.md", "pyproject.toml"]
