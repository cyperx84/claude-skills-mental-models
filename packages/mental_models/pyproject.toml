[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mental-models"
version = "0.1.0"
description = "Charlie Munger's latticework of mental models as a Python library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cyperx" }]
keywords = ["mental-models", "decision-making", "munger", "thinking", "latticework"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/cyperx84/claude-skills-mental-models"
Repository = "https://github.com/cyperx84/claude-skills-mental-models"
Issues = "https://github.com/cyperx84/claude-skills-mental-models/issues"
Changelog = "https://github.com/cyperx84/claude-skills-mental-models/blob/main/CHANGELOG.md"

[project.scripts]
mental-models = "mental_models.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/mental_models"]

[tool.hatch.build.targets.wheel.force-include]
"src/mental_models/data/model-index.json" = "mental_models/data/model-index.json"

[tool.hatch.build.targets.sdist]
include = ["src/mental_models", "README.md", "LICENSE", "pyproject.toml"]
