[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mental-models-mcp"
version = "0.1.0"
description = "MCP server exposing Charlie Munger's mental models to any agent harness"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cyperx" }]
keywords = ["mcp", "mental-models", "munger", "agents", "llm", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mental-models>=0.2.0",
  "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/cyperx84/claude-skills-mental-models"
Repository = "https://github.com/cyperx84/claude-skills-mental-models"
Issues = "https://github.com/cyperx84/claude-skills-mental-models/issues"
Changelog = "https://github.com/cyperx84/claude-skills-mental-models/blob/main/CHANGELOG.md"

[project.scripts]
mental-models-mcp = "mental_models_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.uv]
package = true

# Dev-time path dependency: before mental-models>=0.2.0 is on PyPI, resolve it
# from the sibling package in this monorepo. `uv sync` honors this override;
# at publish time the PyPI dep above is what ships in the wheel.
[tool.uv.sources]
mental-models = { path = "../mental_models", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mental_models_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/mental_models_mcp", "README.md", "LICENSE", "pyproject.toml"]
